# Ground truth for MEMORY.original.md (written together with it, before running
# consolidation). Used by code/hw06/consolidation_test.py to grade the result.
#
# Contradictions: the consolidated "## Facts" section must state `keep` and must
# not state `drop` as a current fact; `drop` must still be visible in
# "## Resolved contradictions" or "## Needs review" (no silent deletion).
contradictions:
  - topic: supervisor
    keep: "Dana Whitfield"
    drop: "Mark Chen"
    rule: newest date wins (2026-10-05 over 2026-09-02)
  - topic: district
    keep: "Willow Glen"
    drop: "Downtown San Jose"
    rule: newest date wins (2026-09-25 over 2026-09-01)
  - topic: report format
    keep: "bullet"
    drop: "numbered paragraphs"
    rule: newest date wins (2026-10-03 over 2026-09-10)
  - topic: Golden Dragon follow-up date
    keep: "November 10"
    drop: "November 3"
    rule: newest date wins (2026-10-14 over 2026-10-01)
  - topic: Golden Dragon facility code
    keep: "FA0148210"
    drop: "FA0148201"
    rule: the OLDER fact wins - it is confirmed from the permit, the newer one is an unverified guess
          (a plain newest-wins consolidation gets this one wrong)

