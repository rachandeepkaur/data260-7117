<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bike-Share Plan Agent</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#5d6675; --line:#dde1e7; --accent:#0b6bcb;
          --good:#137a3a; --warn:#a35a00; --bad:#b42318; --mono: ui-monospace, SFMono-Regular, Menlo, monospace; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:14px 20px; background:#14213d; color:#fff; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  header h1 { font-size:17px; margin:0; } header span { opacity:.8; font-size:13px; }
  main { padding:16px 20px; display:grid; gap:16px; grid-template-columns: minmax(0,1fr) minmax(0,1.3fr); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
  .card h2 { font-size:15px; margin:0 0 10px; }
  form { display:flex; flex-wrap:wrap; gap:10px; align-items:end; grid-column: 1 / -1; }
  label { display:flex; flex-direction:column; gap:4px; font-weight:600; font-size:13px; }
  input[type=url] { width:min(460px, 80vw); padding:7px 8px; border:1px solid var(--line); border-radius:6px; }
  button { padding:8px 18px; border:0; border-radius:6px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.55; cursor:progress; }
  #status { color:var(--muted); }
  .metrics { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .metric { border:1px solid var(--line); border-radius:6px; padding:6px 10px; background:#fafbfc; }
  .metric b { display:block; font-size:16px; } .metric small { color:var(--muted); }
  .decision { font-size:20px; font-weight:700; margin:4px 0 8px; }
  .decision.member { color:var(--good); } .decision.ppu { color:var(--accent); }
  table { border-collapse:collapse; width:100%; margin:6px 0 12px; font-size:13px; }
  th, td { border-bottom:1px solid var(--line); padding:5px 6px; text-align:right; }
  th:first-child, td:first-child { text-align:left; }
  .timeline { max-height:72vh; overflow:auto; }
  .ev { border-left:3px solid var(--line); padding:4px 10px; margin:0 0 8px; }
  .ev.tool_call { border-color:var(--accent); } .ev.observation { border-color:#8a94a6; }
  .ev.final { border-color:var(--good); } .ev.repair { border-color:var(--warn); }
  .ev .head { font-weight:600; font-size:12.5px; } .ev .t { color:var(--muted); font-weight:400; }
  pre { font-family:var(--mono); font-size:11.5px; white-space:pre-wrap; word-break:break-word; margin:4px 0 0;
        background:#f3f4f6; padding:6px 8px; border-radius:4px; max-height:180px; overflow:auto; }
  .muted { color:var(--muted); } .ok { color:var(--good); } .no { color:var(--bad); }
  ul { margin:4px 0 10px 18px; padding:0; }
  blockquote { margin:4px 0; padding:4px 10px; border-left:3px solid var(--line); color:#333; }
</style>
</head>
<body>
<header>
  <h1>Bay Wheels: Monthly Membership vs Pay-Per-Use (ReAct/MRKL agent)</h1>
  <span>Rachandeep Kaur · data260-7117 · HW7 Part 4 · local qwen3:8b</span>
</header>
<main>
  <form id="run-form" class="card">
    <label>Trip CSV <input type="file" id="csv" name="file" accept=".csv,text/csv" required></label>
    <label>Pricing page URL <input type="url" id="url" name="pricing_url" required
           value="https://www.lyft.com/bikes/bay-wheels/pricing"></label>
    <button type="submit" id="run">Run</button>
    <span id="status"></span>
  </form>

  <section class="card">
    <h2>Timeline (tool calls and observations)</h2>
    <div id="timeline" class="timeline"><p class="muted">Run the agent to see each step.</p></div>
  </section>

  <section class="card">
    <h2>Results</h2>
    <div id="results"><p class="muted">No run yet.</p></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = (v) => (v === null || v === undefined || v === "") ? "–" : "$" + Number(v).toFixed(2);
const num = (v, d = 2) => (v === null || v === undefined) ? "–" : Number(v).toFixed(d).replace(/\.00$/, "");

function renderTimeline(events) {
  $("timeline").innerHTML = events.map((e) => {
    const body = e.type === "tool_call" ? JSON.stringify(e.input, null, 1)
               : e.type === "observation" ? e.output : e.text;
    const title = e.type === "tool_call" ? `→ call ${e.tool}` : e.type === "observation" ? `← observation (${e.tool})`
               : e.type === "final" ? "final answer" : "repair";
    return `<div class="ev ${e.type}"><div class="head">${esc(title)} <span class="t">+${(e.t_ms / 1000).toFixed(1)} s</span></div><pre>${esc(body)}</pre></div>`;
  }).join("") || '<p class="muted">No events.</p>';
}

function renderResults(r) {
  const rep = r.report, ref = r.reference, cb = rep?.cost_breakdown || {};
  const snap = (r.snapshots || [])[0];
  const metrics = `<div class="metrics">
    <div class="metric"><small>Steps (tool calls)</small><b>${r.steps}</b></div>
    <div class="metric"><small>Total time</small><b>${(r.total_ms / 1000).toFixed(1)} s</b></div>
    <div class="metric"><small>Stop reason</small><b>${esc(r.stop_reason)}</b></div>
    <div class="metric"><small>Model turns</small><b>${r.model_turns}</b></div>
    <div class="metric"><small>Tokens</small><b>${r.usage?.total_tokens ?? "–"}</b></div></div>`;
  if (!rep) {
    $("results").innerHTML = metrics + `<p class="no">No valid report: ${esc(r.parse_error || r.final_text)}</p>`;
    return;
  }
  const cls = rep.decision.startsWith("Buy") ? "member" : "ppu";
  const row = (label, a, b, fmt = money) => `<tr><td>${label}</td><td>${fmt(a)}</td><td>${ref ? fmt(b) : "–"}</td></tr>`;
  $("results").innerHTML = metrics + `
    <div class="decision ${cls}">${esc(rep.decision)}</div>
    <p>${esc(rep.justification)}</p>
    <h2>Cost comparison</h2>
    <table><tr><th></th><th>Agent</th><th>Reference check</th></tr>
      ${row("Pay-per-use total", cb.pay_per_use_total, ref?.pay_per_use_total)}
      ${row("Membership fees", cb.membership_fee_total, ref?.membership_fee_total)}
      ${row("Member residual charges", cb.membership_residual_charges, ref?.membership_residual_charges)}
      ${row("Membership total", cb.membership_total, ref?.membership_total)}
      ${row("Months", cb.months, ref?.months, (v) => num(v, 0))}
      ${row("Rides", cb.rides, ref?.rides, (v) => num(v, 0))}
      ${row("Break-even rides / month", cb.break_even_rides_per_month, ref?.break_even_rides_per_month, num)}
      ${row("Actual rides / month", cb.actual_rides_per_month, ref?.actual_rides_per_month, num)}
    </table>
    <p class="${r.reference_agrees ? "ok" : "no"}">Reference check (deterministic recomputation from the same snapshot):
      ${ref ? esc(ref.decision) + (r.reference_agrees ? " — agrees" : " — disagrees") : "pricing not parseable"}</p>
    <h2>By week (most recent weeks)</h2>
    <table><tr><th>Week starting</th><th>Rides</th><th>Avg duration (min)</th><th>Spend (pay-per-use)</th></tr>
      ${(rep.weekly || []).map((w) => `<tr><td>${esc(w.week_start)}</td><td>${num(w.rides, 0)}</td><td>${num(w.avg_duration_min, 1)}</td><td>${money(w.spend)}</td></tr>`).join("")}
    </table>
    <h2>Citations</h2>
    ${(rep.citations || []).map((c) => `<blockquote>“${esc(c.quote)}”<br><small class="muted">${esc(c.source)}</small></blockquote>`).join("")}
    ${snap ? `<p class="muted">Pricing page: <a href="${esc(snap.url)}">${esc(snap.url)}</a> · captured ${esc(snap.accessed_at)} · SHA-256 ${esc(snap.sha256.slice(0, 16))}…</p>` : ""}
    <h2>Assumptions and caveats</h2>
    <ul>${(rep.assumptions || []).map((a) => `<li>${esc(a)}</li>`).join("")}</ul>
    <p class="muted">Evidence saved to ${esc(r.evidence_dir || "")}</p>`;
}

$("run-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const file = $("csv").files[0];
  if (!file) return;
  const data = new FormData();
  data.append("file", file);
  data.append("pricing_url", $("url").value);
  $("run").disabled = true;
  const t0 = Date.now();
  const timer = setInterval(() => { $("status").textContent = `Running… ${((Date.now() - t0) / 1000).toFixed(0)} s (local model on CPU)`; }, 500);
  $("timeline").innerHTML = '<p class="muted">Agent is working…</p>';
  try {
    const resp = await fetch("/api/bikeshare/run", { method: "POST", body: data });
    const body = await resp.json();
    if (!resp.ok) throw new Error(body.detail || resp.statusText);
    renderTimeline(body.timeline);
    renderResults(body);
    $("status").textContent = `Done: ${file.name}`;
  } catch (err) {
    $("status").textContent = "Error: " + err.message;
  } finally {
    clearInterval(timer);
    $("run").disabled = false;
  }
});
</script>
</body>
</html>
